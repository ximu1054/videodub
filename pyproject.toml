[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "videodub"
version = "0.2.0"
description = "把英文视频整条换成中文配音，逐句对齐原时间轴，全程在自己电脑上跑完"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "heli" }]
keywords = ["dubbing", "translation", "whisper", "tts", "video", "chinese", "subtitle"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Video",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]

dependencies = [
  "faster-whisper>=1.2,<2",
  "edge-tts>=7.0,<8",
  "yt-dlp>=2025.1",
  "numpy>=1.26,<3",
  "imageio-ffmpeg>=0.5",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# 本地翻译后端（Qwen）。不装也能用：改走 API 翻译。
local-mt = [
  "torch>=2.4",
  "torchaudio>=2.4",
  "transformers>=4.44,<6",
  "accelerate>=0.30",
]
# 实验性：自动分离人声/伴奏。demucs 4.x 钉 torchaudio<2.1，标准解析器会冲突，
# 安装方式见 docs/install-gpu.md；默认请用「自带伴奏文件」路径。
bgm = ["demucs>=4.1"]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "httpx>=0.27",
]

[project.scripts]
videodub = "videodub.cli:main"

[project.urls]
Homepage = "https://github.com/ximu1054/videodub"
Issues = "https://github.com/ximu1054/videodub/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/videodub"]

[tool.hatch.build.targets.wheel.force-include]
"src/videodub/web/static" = "videodub/web/static"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 默认跳过需要 GPU / 联网的用例：本地一条 pytest 就该全绿。
# 要跑全部：pytest -m "gpu or network"
addopts = "-q --strict-markers -m 'not gpu and not network'"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
  "gpu: 需要 GPU / 需要下载模型的测试（CI 里跳过）",
  "network: 需要联网的测试（CI 里跳过）",
]

# ---------------------------------------------------------------------------
# uv 用户：torch 从 PyTorch 官方索引取 CUDA 版本，一条命令装完。
# 为什么不用 extra：pip 的 extra 无法声明「这个包从另一个 index 拿」，
# 加 --extra-index-url 会对所有包生效，把 numpy/tokenizers 也带去 pytorch 索引。
# ---------------------------------------------------------------------------
[tool.uv]
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchaudio = { index = "pytorch-cu126" }
