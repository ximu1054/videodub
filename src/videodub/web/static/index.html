<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VideoDub · 视频转中文配音</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M7 5.2v13.6L18.4 12 7 5.2z" fill="currentColor"/>
        <rect x="20" y="5.2" width="2.6" height="13.6" rx="1.3" fill="currentColor" opacity=".62"/>
      </svg>
    </span>
    <div>
      <h1>VideoDub</h1>
      <p class="tagline">把英文视频整条换成中文配音</p>
    </div>
  </div>
  <div class="env" id="env">
    <span class="pill" id="pill-gpu">检测中…</span>
    <span class="pill" id="pill-ffmpeg">ffmpeg</span>
    <span class="pill" id="pill-model">模型</span>
  </div>
  <div class="queue" id="queue">队列空闲</div>
</header>

<main class="layout">

  <!-- ==================== 左：新建任务 ==================== -->
  <aside class="panel">
    <h2>新建任务</h2>

    <div class="dropzone" id="dropzone" tabindex="0" role="button"
         aria-label="拖入视频文件或点击选择">
      <svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true">
        <path d="M12 16V4m0 0L8 8m4-4 4 4" fill="none" stroke="currentColor"
              stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" fill="none"
              stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <strong>拖入视频文件</strong>
      <span>或点击选择 · MP4 / MKV / MOV 等</span>
    </div>
    <input type="file" id="file-input" accept="video/*,.mkv,.ts" hidden>

    <div class="or"><span>或粘贴链接</span></div>

    <div class="url-row">
      <input type="url" id="url-input" placeholder="https://www.youtube.com/watch?v=…"
             autocomplete="off" spellcheck="false">
      <button id="btn-probe" class="ghost" title="只读取标题，不下载">读取</button>
    </div>

    <div class="summary" id="summary" hidden></div>

    <!-- 链接是合集时出现：选择只做这一集，还是整条合集逐集做完 -->
    <div class="scope" id="scope" hidden>
      <div class="scope-head">
        <span class="scope-tag">合集</span>
        <span class="scope-name" id="scope-name"></span>
        <span class="scope-count" id="scope-count"></span>
      </div>

      <label class="scope-opt">
        <input type="radio" name="scope" value="single" checked>
        <span class="scope-dot" aria-hidden="true"></span>
        <span class="scope-txt">
          <b>只处理这一集</b>
          <em id="scope-single-meta">当前打开的这一集</em>
        </span>
      </label>

      <label class="scope-opt">
        <input type="radio" name="scope" value="playlist">
        <span class="scope-dot" aria-hidden="true"></span>
        <span class="scope-txt">
          <b>处理整个合集</b>
          <em id="scope-all-meta">逐集依次处理</em>
        </span>
      </label>

      <div class="scope-limit" id="scope-limit-wrap" hidden>
        <span>最多处理前</span>
        <input type="number" id="scope-limit" min="1" step="1"
               inputmode="numeric" placeholder="全部" autocomplete="off">
        <span>集</span>
      </div>
      <p class="scope-tip" id="scope-tip" hidden></p>
    </div>

    <details class="advanced" id="advanced">
      <summary>高级参数</summary>

      <label class="field">
        <span>识别模型</span>
        <select id="p-asr">
          <option value="small">small · 0.5 GB · 最快</option>
          <option value="medium">medium · 1.5 GB · 平衡</option>
          <option value="large-v3" selected>large-v3 · 2.9 GB · 质量最好</option>
        </select>
      </label>

      <label class="field">
        <span>翻译引擎</span>
        <select id="p-mt">
          <option value="auto" selected>自动（有 API key 就用 API）</option>
          <option value="local">本地模型（离线，5.8 GB）</option>
          <option value="api">API（更快更准）</option>
          <option value="none">不翻译（只转写 + 原文配音）</option>
        </select>
      </label>

      <div class="field">
        <span>音色</span>
        <div class="voices" id="voices"></div>
      </div>

      <label class="field">
        <span>语速 <b id="rate-val">+8%</b></span>
        <input type="range" id="p-rate" min="-10" max="20" step="2" value="8">
      </label>

      <label class="field">
        <span>最大压缩 <b id="tempo-val">1.15×</b></span>
        <input type="range" id="p-tempo" min="100" max="130" step="5" value="115">
        <small>越小越自然，代价是偶尔顺延</small>
      </label>

      <label class="field">
        <span>起始偏移 <b id="offset-val">0.0s</b></span>
        <input type="range" id="p-offset" min="-30" max="30" step="1" value="0">
        <small>整体前移/后移音轨，补偿音画错位</small>
      </label>

      <label class="field">
        <span>保留原伴奏</span>
        <select id="p-bgm">
          <option value="" selected>关（只有中文人声）</option>
          <option value="__file__">我提供伴奏文件…</option>
        </select>
        <input type="file" id="bgm-input" accept="audio/*,.wav,.mp3" hidden>
      </label>
    </details>

    <button id="btn-submit" class="primary" disabled>开始配音</button>
    <p class="hint" id="submit-hint">先拖入文件或粘贴链接</p>
  </aside>

  <!-- ==================== 右：任务列表 ==================== -->
  <section class="jobs">
    <div class="jobs-head">
      <h2>任务</h2>
      <button class="ghost small" id="btn-refresh">刷新</button>
    </div>
    <div id="job-list" class="job-list"></div>
    <div class="empty" id="empty-state">
      <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="5" y="15" width="34" height="34" rx="9"/>
        <path d="M19 24.5 27.5 32 19 39.5v-15z" fill="currentColor" stroke="none"/>
        <path d="M45 26a9 9 0 0 1 0 12"/>
        <path d="M51.5 20.5a18 18 0 0 1 0 23"/>
      </svg>
      <p>还没有任务</p>
      <p class="muted">拖一个英文视频进来，几分钟后就有中文配音版。</p>
    </div>
  </section>

</main>

<div class="banner-model" id="model-banner" hidden>
  <span id="model-banner-text"></span>
  <button class="ghost small" id="btn-banner-close">知道了</button>
</div>

<audio id="preview-audio" preload="none"></audio>
<div class="toast" id="toast" hidden></div>

<script type="module" src="/static/app.js"></script>
</body>
</html>
